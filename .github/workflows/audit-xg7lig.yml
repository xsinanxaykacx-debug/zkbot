name: Audit xg7lig 8-league xG source

on:
  workflow_dispatch:
  push:
    branches: [main, "research/xg7lig-audit"]
    paths:
      - "xg7lig.csv"
      - "scripts/audit_xg7lig.py"
      - ".github/workflows/audit-xg7lig.yml"

permissions:
  contents: read

jobs:
  audit-xg7lig:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install audit dependency
        run: python -m pip install --disable-pip-version-check "pandas==2.2.3"
      - name: Audit CSV schema, league-season coverage, dates, xG completeness and duplicates
        run: python scripts/audit_xg7lig.py xg7lig.csv --json audit-results/xg7lig_audit.json
      - name: Upload machine-readable audit report
        uses: actions/upload-artifact@v4
        with:
          name: xg7lig-source-audit
          path: audit-results/xg7lig_audit.json
          if-no-files-found: error
          retention-days: 30
