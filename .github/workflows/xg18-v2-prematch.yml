name: XG18 v2 pre-match challenger

on:
  push:
    branches:
      - work/xg18-v2-prematch-features
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  challenger:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: python -m pip install -r requirements-xg18-v2.txt pytest
      - name: Download permitted train and validation data
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 43848824932 --repo ${{ github.repository }} --name zk2-xg18-split-v1-non-test --dir data
          test -s data/xg18_train.csv
          test -s data/xg18_val.csv
      - name: Download frozen baseline predictions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 43885303014 --repo ${{ github.repository }} --name xg18-bot-validation-results --dir baseline
          test -s baseline/xg18_validation_predictions.csv
      - name: Test same-day leakage protection
        run: PYTHONPATH=scripts python -m pytest -q tests/test_prematch_features.py
      - name: Tune on training chronology and evaluate candidate
        run: |
          python scripts/train_xg18_v2.py --train data/xg18_train.csv --validation data/xg18_val.csv --outdir reports --trials 4
      - name: Paired baseline comparison
        run: |
          python scripts/compare_xg18_v2_baseline.py --baseline baseline/xg18_validation_predictions.csv --candidate reports/xg18_v2_validation_predictions.csv --output reports/xg18_v2_baseline_comparison.json --bootstrap 30000
      - name: Smoke test upcoming fixture CLI
        run: |
          python - <<'PY'
          import pandas as pd
          v=pd.read_csv('data/xg18_val.csv')
          d=pd.to_datetime(v['Date'],utc=True).dt.floor('D').min()
          f=v[pd.to_datetime(v['Date'],utc=True).dt.floor('D')==d][['League','Season','Date','HomeTeam','AwayTeam']]
          f.to_csv('/tmp/xg18-v2-smoke-fixtures.csv',index=False)
          print('smoke fixtures:',len(f))
          PY
          python scripts/xg18_v2_bot.py --history data/xg18_train.csv --fixtures /tmp/xg18-v2-smoke-fixtures.csv --model reports/xg18_v2.joblib --output reports/xg18_v2_smoke.csv --threshold 0.65
          test -s reports/xg18_v2_smoke.csv
      - name: Upload challenger model and reports
        uses: actions/upload-artifact@v4
        with:
          name: xg18-v2-prematch-challenger
          path: |
            reports/xg18_v2.joblib
            reports/xg18_v2_model_metadata.json
            reports/xg18_v2_report.json
            reports/xg18_v2_validation_predictions.csv
            reports/xg18_v2_baseline_comparison.json
            reports/xg18_v2_smoke.csv
          if-no-files-found: error
