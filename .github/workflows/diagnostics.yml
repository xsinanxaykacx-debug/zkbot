name: ZK 2.0 post-hoc match diagnostics

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "scripts/export_diagnostics.py"
      - "src/zk2/diagnostics.py"
      - "tests/test_export_diagnostics.py"
      - "scripts/run_epl_feature_ablation.py"
      - "tests/test_epl_feature_ablation.py"
      - ".github/workflows/diagnostics.yml"

permissions:
  contents: read

jobs:
  diagnostics:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout ZK 2.0 and EPL workbook
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install project
        run: python -m pip install --upgrade pip && pip install -e .
      - name: Download DATA.csv source
        run: curl --fail --location --retry 3 --output DATA.csv https://raw.githubusercontent.com/xsinanxaykacx-debug/trsuper/main/data/csv/DATA.csv
      - name: Rebuild locked dataset and chronological features
        run: |
          python scripts/build_locked_dataset.py DATA.csv EPL.xlsm --output zk2_locked_dataset.csv.gz --manifest zk2_dataset_manifest.json
          python scripts/run_real_baselines.py zk2_locked_dataset.csv.gz --features zk2_features_v1.csv.gz --report zk2_real_baseline_report.json
      - name: Reconfirm fixed validation-only LR decisions
        run: python -m zk2.models.lightgbm_search zk2_features_v1.csv.gz --report zk2_lightgbm_search_report.json
      - name: Export confirmation and final-test row-level predictions
        run: python scripts/export_diagnostics.py zk2_features_v1.csv.gz zk2_lightgbm_search_report.json --csv audit-results/diagnostics_confirmation_test.csv --summary audit-results/diagnostics_summary.json --expected-test-rows 1550
      - name: Run EPL confirmation feature ablation
        run: python scripts/run_epl_feature_ablation.py zk2_features_v1.csv.gz --csv audit-results/epl_feature_ablation.csv --json audit-results/epl_feature_ablation.json
      - name: Upload diagnostic data
        uses: actions/upload-artifact@v4
        with:
          name: zk2-match-diagnostics
          path: |
            audit-results/diagnostics_confirmation_test.csv
            audit-results/diagnostics_summary.json
            audit-results/epl_feature_ablation.csv
            audit-results/epl_feature_ablation.json
            zk2_dataset_manifest.json
          if-no-files-found: error
