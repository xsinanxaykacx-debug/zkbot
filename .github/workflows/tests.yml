name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e ".[dev]"
      - name: All tests with coverage (minimum 80 percent)
        run: pytest tests/ --cov=zk2 --cov-report=term-missing --cov-fail-under=80
      - name: Leakage tests (critical summary)
        run: pytest tests/ -m leakage -v --strict-markers
