name: XG18 v3 chronological ensemble challenger

on:
  push:
    branches:
      - work/xg18-v3-ensemble
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  challenger:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: python -m pip install -r requirements-xg18-v3.txt pytest
      - name: Download permitted train and validation data
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 43848824932 --repo ${{ github.repository }} --name zk2-xg18-split-v1-non-test --dir data
          test -s data/xg18_train.csv
          test -s data/xg18_val.csv
      - name: Download frozen baseline predictions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 43885303014 --repo ${{ github.repository }} --name xg18-bot-validation-results --dir baseline
          test -s baseline/xg18_validation_predictions.csv
      - name: Download V2 challenger predictions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 43891131489 --repo ${{ github.repository }} --name xg18-v2-prematch-challenger --dir v2
          test -s v2/xg18_v2_validation_predictions.csv
      - name: Test chronological feature leakage controls
        run: PYTHONPATH=scripts python -m pytest -q tests/test_prematch_features.py tests/test_v3_features.py
      - name: Train and evaluate V3 on untouched validation outcomes
        run: |
          python scripts/train_xg18_v3.py --train data/xg18_train.csv --validation data/xg18_val.csv --outdir reports --trials 3
      - name: Compare baseline, V2 and V3 on identical MatchIDs
        run: |
          python scripts/compare_xg18_v3.py --baseline baseline/xg18_validation_predictions.csv --v2 v2/xg18_v2_validation_predictions.csv --v3 reports/xg18_v3_validation_predictions.csv --output reports/xg18_v3_comparison.json --bootstrap 30000
      - name: Smoke test upcoming fixture CLI
        run: |
          python - <<'PY'
          import pandas as pd
          v=pd.read_csv('data/xg18_val.csv')
          d=pd.to_datetime(v['Date'],utc=True).dt.floor('D').min()
          f=v[pd.to_datetime(v['Date'],utc=True).dt.floor('D')==d][['League','Season','Date','HomeTeam','AwayTeam']]
          f.to_csv('/tmp/xg18-v3-smoke-fixtures.csv',index=False)
          PY
          python scripts/xg18_v3_bot.py --history data/xg18_train.csv --fixtures /tmp/xg18-v3-smoke-fixtures.csv --model reports/xg18_v3.joblib --output reports/xg18_v3_smoke.csv --threshold 0.65
          test -s reports/xg18_v3_smoke.csv
      - name: Upload V3 model and reports
        uses: actions/upload-artifact@v4
        with:
          name: xg18-v3-ensemble-challenger
          path: |
            reports/xg18_v3.joblib
            reports/xg18_v3_report.json
            reports/xg18_v3_validation_predictions.csv
            reports/xg18_v3_comparison.json
            reports/xg18_v3_smoke.csv
          if-no-files-found: error
