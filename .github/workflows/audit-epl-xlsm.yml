name: EPL XLSM structural audit

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "EPL.xlsm"
      - "scripts/audit_epl_xlsm.py"
      - "scripts/audit_source_overlap.py"
      - ".github/workflows/audit-epl-xlsm.yml"

permissions:
  contents: read

jobs:
  audit-epl:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout ZK 2.0 and EPL workbook
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install project and workbook dependency
        run: python -m pip install --upgrade pip && pip install -e .
      - name: Audit workbook structure without executing macros
        run: python scripts/audit_epl_xlsm.py EPL.xlsm --output epl_xlsm_audit.json
      - name: Download DATA.csv from source repository
        run: curl --fail --location --retry 3 --output DATA.csv https://raw.githubusercontent.com/xsinanxaykacx-debug/trsuper/main/data/csv/DATA.csv
      - name: Compare normalized source identities
        run: python scripts/audit_source_overlap.py DATA.csv EPL.xlsm --output source_overlap_report.json
      - name: Upload workbook and overlap audits
        uses: actions/upload-artifact@v4
        with:
          name: zk2-epl-xlsm-and-source-overlap-audit
          path: |
            epl_xlsm_audit.json
            source_overlap_report.json
          if-no-files-found: error
