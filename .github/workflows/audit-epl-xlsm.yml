name: EPL XLSM structural audit

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "EPL.xlsm"
      - "scripts/audit_epl_xlsm.py"
      - ".github/workflows/audit-epl-xlsm.yml"

permissions:
  contents: read

jobs:
  audit-epl:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout ZK 2.0 and EPL workbook
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install openpyxl
        run: python -m pip install --upgrade pip openpyxl
      - name: Audit workbook structure without executing macros
        run: python scripts/audit_epl_xlsm.py EPL.xlsm --output epl_xlsm_audit.json
      - name: Upload workbook audit
        uses: actions/upload-artifact@v4
        with:
          name: zk2-epl-xlsm-audit
          path: epl_xlsm_audit.json
          if-no-files-found: error
