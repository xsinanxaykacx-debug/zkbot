name: Build xG18 plus all-league odds dataset
on:
  push:
    branches: [work/xg18-v3-odds]
    paths:
      - "*.csv"
      - "scripts/merge_xg18_all_league_odds.py"
      - ".github/workflows/xg18-v3-odds-merge.yml"
  workflow_dispatch:
permissions:
  contents: read
  actions: write
jobs:
  merge:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip pandas
      - name: Merge xG18 with all 70 league odds files
        run: python scripts/merge_xg18_all_league_odds.py --xg xg18.csv --odds-dir . --out artifacts/xg18_odds
      - uses: actions/upload-artifact@v4
        with:
          name: xg18-all-league-odds-merged
          path: |
            artifacts/xg18_odds/xg18_with_all_league_odds.csv
            artifacts/xg18_odds/merge_report.json
          if-no-files-found: error
          retention-days: 30
