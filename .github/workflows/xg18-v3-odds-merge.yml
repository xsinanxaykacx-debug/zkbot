name: XG18 odds merge and odds-aware V3 training
on:
  push:
    branches: [work/xg18-v3-odds]
    paths:
      - "*.csv"
      - "scripts/merge_xg18_all_league_odds.py"
      - "scripts/prepare_xg18_odds_splits.py"
      - "scripts/xg18_v3_features.py"
      - "scripts/train_xg18_v3.py"
      - "scripts/compare_xg18_v3_odds.py"
      - "tests/test_v3_market_features.py"
      - ".github/workflows/xg18-v3-odds-merge.yml"
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  odds-aware-challenger:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install model dependencies
        run: python -m pip install -r requirements-xg18-v3.txt pytest
      - name: Download official non-test chronological split
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 43848824932 --repo ${{ github.repository }} --name zk2-xg18-split-v1-non-test --dir data
          test -s data/xg18_train.csv
          test -s data/xg18_val.csv
      - name: Download frozen no-odds V3 validation predictions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 43892603517 --repo ${{ github.repository }} --name xg18-v3-ensemble-challenger --dir baseline-v3
          test -s baseline-v3/xg18_v3_validation_predictions.csv
      - name: Merge xG18 with all 70 odds files using official MatchID whitelist
        run: |
          python scripts/merge_xg18_all_league_odds.py --xg xg18.csv --odds-dir . --include-csv data/xg18_train.csv --include-csv data/xg18_val.csv --out artifacts/xg18_odds
      - name: Attach odds to the original chronological train and validation partitions
        run: |
          python scripts/prepare_xg18_odds_splits.py --merged artifacts/xg18_odds/xg18_with_all_league_odds.csv --train data/xg18_train.csv --validation data/xg18_val.csv --outdir data
      - name: Test leakage-safe and market features
        run: PYTHONPATH=scripts python -m pytest -q tests/test_prematch_features.py tests/test_v3_features.py tests/test_v3_market_features.py
      - name: Train odds-aware V3 and evaluate untouched validation
        run: |
          python scripts/train_xg18_v3.py --train data/xg18_train_odds.csv --validation data/xg18_validation_odds.csv --outdir reports --trials 3
      - name: Compare odds-aware V3 against frozen no-odds V3
        run: |
          python scripts/compare_xg18_v3_odds.py --baseline baseline-v3/xg18_v3_validation_predictions.csv --candidate reports/xg18_v3_validation_predictions.csv --output reports/xg18_v3_odds_comparison.json --bootstrap 30000
      - name: Smoke test the odds-aware upcoming-fixture bot
        run: |
          python - <<'PY'
          import pandas as pd
          v=pd.read_csv('data/xg18_validation_odds.csv')
          d=pd.to_datetime(v['Date'],utc=True).dt.floor('D').min()
          f=v[pd.to_datetime(v['Date'],utc=True).dt.floor('D')==d]
          f.to_csv('/tmp/xg18-v3-odds-smoke-fixtures.csv',index=False)
          PY
          python scripts/xg18_v3_bot.py --history data/xg18_train_odds.csv --fixtures /tmp/xg18-v3-odds-smoke-fixtures.csv --model reports/xg18_v3.joblib --output reports/xg18_v3_odds_smoke.csv --threshold 0.65
          test -s reports/xg18_v3_odds_smoke.csv
      - uses: actions/upload-artifact@v4
        with:
          name: xg18-v3-odds-aware-challenger
          path: |
            artifacts/xg18_odds/xg18_with_all_league_odds.csv
            artifacts/xg18_odds/merge_report.json
            reports/xg18_v3.joblib
            reports/xg18_v3_report.json
            reports/xg18_v3_validation_predictions.csv
            reports/xg18_v3_odds_comparison.json
            reports/xg18_v3_odds_smoke.csv
          if-no-files-found: error
          retention-days: 90
