name: XG18 bot build and validation

on:
  push:
    branches:
      - work/football-prediction-bot-v1
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/football-prediction-bot-v1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Assemble and verify frozen model package
        shell: bash
        run: |
          cat research/xg18-frozen-source.zip.part00 research/xg18-frozen-source.zip.part01 research/xg18-frozen-source.zip.part02 research/xg18-frozen-source.zip.part03 research/xg18-frozen-source.zip.part04 research/xg18-frozen-source.zip.part05 research/xg18-frozen-source.zip.part06 research/xg18-frozen-source.zip.part06b research/xg18-frozen-source.zip.part07 research/xg18-frozen-source.zip.part08 research/xg18-frozen-source.zip.part09 > /tmp/xg18-frozen-source.zip
          echo "d8d62f65b8887084a80d1da84ec6a758c401257172e50d5ef8a7137cc1dbc7aa  /tmp/xg18-frozen-source.zip" | sha256sum -c -
          python - <<'PY'
          import pathlib, zipfile, hashlib
          z=zipfile.ZipFile('/tmp/xg18-frozen-source.zip')
          bad=z.testzip()
          if bad is not None: raise SystemExit(f'ZIP CRC failure: {bad}')
          z.extractall('frozen_src')
          p=pathlib.Path('frozen_src/xg18_frozen_model.py')
          actual=hashlib.sha256(p.read_bytes()).hexdigest()
          expected='79d89fa9491643590b96eb0e4a2761b0612a245247bd1fe40ed6b29710071e6e'
          print('frozen_module_sha256',actual)
          if actual != expected: raise SystemExit('Frozen model module hash mismatch')
          print('Frozen source integrity: PASS')
          PY
      - name: Install frozen runtime
        run: python -m pip install -r frozen_src/requirements-xg18-freeze.txt
      - name: Download permitted train and validation partitions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 43848824932 --repo ${{ github.repository }} --name zk2-xg18-split-v1-non-test --dir data
          test -s data/xg18_train.csv
          test -s data/xg18_val.csv
      - name: Evaluate frozen model on chronological validation
        run: |
          python scripts/evaluate_xg18_validation.py --train data/xg18_train.csv --validation data/xg18_val.csv --predictions reports/xg18_validation_predictions.csv --report reports/xg18_validation_report.json
      - name: Upload reproducible validation outputs
        uses: actions/upload-artifact@v4
        with:
          name: xg18-bot-validation-results
          path: |
            reports/xg18_validation_predictions.csv
            reports/xg18_validation_report.json
          if-no-files-found: error
